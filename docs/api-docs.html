<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hyperf Skeleton API</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --side: #fbfbfc;
    --text: #1b1f24;
    --muted: #6b7280;
    --border: #e3e6ea;
    --accent: #2563eb;
    --get: #1d4ed8;
    --post: #047857;
    --put: #b45309;
    --delete: #b91c1c;
    --code-bg: #f4f6f8;
    --code-text: #23303f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101215;
      --panel: #181b20;
      --side: #14171b;
      --text: #e5e8ec;
      --muted: #9aa3ae;
      --border: #272c33;
      --accent: #6ea8fe;
      --get: #7aa7ff;
      --post: #4ade80;
      --put: #fbbf24;
      --delete: #f87171;
      --code-bg: #1e2228;
      --code-text: #d7dee7;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .layout { display: flex; min-height: 100vh; }
  aside {
    width: 286px;
    flex: none;
    background: var(--side);
    border-right: 1px solid var(--border);
    padding: 20px 16px 28px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
  }
  .brand { font-weight: 650; font-size: 15px; letter-spacing: .01em; }
  .brand span { display: block; color: var(--muted); font-weight: 400; font-size: 12px; margin-top: 2px; }
  #q {
    width: 100%; margin: 16px 0 14px; padding: 7px 10px;
    border: 1px solid var(--border); border-radius: 7px;
    background: var(--panel); color: var(--text); font-size: 13px; outline: none;
  }
  #q:focus { border-color: var(--accent); }
  .tag { margin: 14px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  nav a {
    display: flex; gap: 8px; align-items: baseline;
    padding: 5px 8px; border-radius: 6px; color: var(--text);
    text-decoration: none; font-size: 13px; word-break: break-all;
  }
  nav a:hover { background: var(--panel); }
  nav a .m { font-size: 10px; font-weight: 700; letter-spacing: .04em; flex: none; }
  .m.get { color: var(--get); } .m.post { color: var(--post); }
  .m.put { color: var(--put); } .m.delete { color: var(--delete); }
  .aside-foot { margin-top: 24px; font-size: 12px; color: var(--muted); }
  .aside-foot a { color: var(--accent); text-decoration: none; }
  main { flex: 1; min-width: 0; padding: 34px 40px 80px; max-width: 980px; }
  h1 { font-size: 22px; margin: 0 0 8px; font-weight: 650; }
  .lead { color: var(--muted); margin: 0 0 22px; max-width: 70ch; }
  .hint {
    display: flex; flex-wrap: wrap; gap: 10px 26px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 30px; font-size: 13px;
  }
  .hint div { color: var(--muted); }
  .hint b { color: var(--text); font-weight: 550; }
  .op {
    background: var(--panel); border: 1px solid var(--border); border-radius: 11px;
    padding: 18px 20px 20px; margin-bottom: 18px; scroll-margin-top: 18px;
  }
  .op-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge {
    font-size: 11px; font-weight: 700; letter-spacing: .06em;
    padding: 3px 8px; border-radius: 5px; border: 1px solid currentColor;
  }
  .badge.get { color: var(--get); } .badge.post { color: var(--post); }
  .badge.put { color: var(--put); } .badge.delete { color: var(--delete); }
  .op-head .path { font-size: 14px; font-weight: 600; }
  .op-head .summary { color: var(--muted); font-size: 13px; margin-left: auto; }
  .lock { font-size: 12px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; }
  .desc { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
  h4 { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 20px 0 8px; font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  td code { font-size: 12.5px; }
  .req { color: var(--delete); font-size: 11px; }
  pre {
    margin: 0; padding: 12px 14px; background: var(--code-bg); color: var(--code-text);
    border: 1px solid var(--border); border-radius: 8px; overflow-x: auto;
    font-size: 12.5px; line-height: 1.55;
  }
  .resp { margin-top: 10px; border-top: 1px dashed var(--border); padding-top: 10px; }
  .resp:first-of-type { border-top: none; padding-top: 0; }
  .resp-head { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .status { font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 4px; background: var(--code-bg); }
  .status.ok { color: var(--post); } .status.err { color: var(--delete); }
  .resp-head span:last-child { color: var(--muted); font-size: 12.5px; }
  .empty { color: var(--muted); }
  @media (max-width: 860px) {
    .layout { display: block; }
    aside { position: static; height: auto; width: auto; border-right: none; border-bottom: 1px solid var(--border); }
    main { padding: 24px 18px 60px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside>
    <div class="brand">Hyperf Skeleton<span id="ver">API</span></div>
    <input id="q" type="search" placeholder="搜索接口或路径…" autocomplete="off">
    <nav id="nav"></nav>
    <div class="aside-foot">
      OpenAPI 3.0 · <a href="/api/docs/openapi.json">openapi.json</a><br>
      可直接导入 Postman / Swagger UI
    </div>
  </aside>
  <main>
    <h1 id="title">接口文档</h1>
    <p class="lead" id="lead"></p>
    <div class="hint">
      <div><b>Base URL</b> <span id="base"></span></div>
      <div><b>鉴权</b> <code>Authorization: Bearer &lt;access_token&gt;</code></div>
      <div><b>响应</b> <code>{"code":0,"message":"ok","data":…}</code></div>
      <div><b>其他视图</b> <a href="/api/docs/redoc" target="_blank" rel="noreferrer">Redoc 视图</a> ·
        <a href="/api/docs/openapi.json" target="_blank" rel="noreferrer">OpenAPI JSON</a></div>
    </div>
    <div id="content"><p class="empty">加载中…</p></div>
  </main>
</div>
<script>
(function () {
  var spec = null;
  var METHODS = ['get', 'post', 'put', 'patch', 'delete'];

  function esc(value) {
    return String(value === undefined || value === null ? '' : value).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function ops() {
    var list = [];
    Object.keys(spec.paths || {}).forEach(function (path) {
      METHODS.forEach(function (method) {
        if (spec.paths[path][method]) {
          list.push({ path: path, method: method, op: spec.paths[path][method] });
        }
      });
    });
    return list;
  }

  function typeOf(schema) {
    if (!schema) return '';
    if (schema.$ref) return schema.$ref.split('/').pop();
    var t = schema.type || '';
    if (t === 'array' && schema.items) return typeOf(schema.items) + '[]';
    if (schema.enum) return (t ? t + ' / ' : '') + schema.enum.join(' | ');
    return t;
  }

  function renderNav() {
    var groups = {};
    ops().forEach(function (item) {
      var tag = (item.op.tags && item.op.tags[0]) || '接口';
      (groups[tag] = groups[tag] || []).push(item);
    });
    var html = '';
    Object.keys(groups).forEach(function (tag) {
      html += '<div class="tag">' + esc(tag) + '</div>';
      groups[tag].forEach(function (item) {
        html += '<a href="#op-' + esc(item.method + item.path) + '" data-key="' + esc((item.method + ' ' + item.path + ' ' + (item.op.summary || '')).toLowerCase()) + '">'
          + '<span class="m ' + item.method + '">' + item.method.toUpperCase() + '</span>'
          + '<span>' + esc(item.path) + '</span></a>';
      });
    });
    document.getElementById('nav').innerHTML = html;
  }

  function renderOp(item, index) {
    var op = item.op;
    var html = '<section class="op" id="op-' + esc(item.method + item.path) + '" data-key="'
      + esc((item.method + ' ' + item.path + ' ' + (op.summary || '') + ' ' + (op.description || '')).toLowerCase()) + '">';
    html += '<div class="op-head"><span class="badge ' + item.method + '">' + item.method.toUpperCase() + '</span>'
      + '<code class="path">' + esc(item.path) + '</code>'
      + (op.security ? '<span class="lock">需登录</span>' : '')
      + '<span class="summary">' + esc(op.summary || '') + '</span></div>';

    if (op.description) html += '<p class="desc">' + esc(op.description) + '</p>';

    if (op.parameters && op.parameters.length) {
      html += '<h4>请求参数</h4><table><thead><tr><th>名称</th><th>位置</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody>';
      op.parameters.forEach(function (p) {
        html += '<tr><td><code>' + esc(p.name) + '</code></td><td>' + esc(p.in) + '</td><td><code>'
          + esc(typeOf(p.schema)) + '</code></td><td>'
          + (p.required ? '<span class="req">是</span>' : '否') + '</td><td>'
          + esc(p.description || p.schema && p.schema.description || '') + '</td></tr>';
      });
      html += '</tbody></table>';
    }

    var body = op.requestBody && op.requestBody.content && op.requestBody.content['application/json'];
    if (body) {
      html += '<h4>请求体</h4>';
      if (body.example) {
        html += '<pre>' + esc(JSON.stringify(body.example, null, 2)) + '</pre>';
      } else if (body.schema && body.schema.properties) {
        html += '<table><thead><tr><th>字段</th><th>类型</th><th>必填</th><th>说明</th></tr></thead><tbody>';
        Object.keys(body.schema.properties).forEach(function (name) {
          var prop = body.schema.properties[name];
          var required = (body.schema.required || []).indexOf(name) >= 0;
          html += '<tr><td><code>' + esc(name) + '</code></td><td><code>' + esc(typeOf(prop)) + '</code></td><td>'
            + (required ? '<span class="req">是</span>' : '否') + '</td><td>' + esc(prop.description || '') + '</td></tr>';
        });
        html += '</tbody></table>';
      }
    }

    var responses = op.responses || {};
    var codes = Object.keys(responses);
    if (codes.length) {
      html += '<h4>响应</h4>';
      codes.forEach(function (code) {
        var resp = responses[code];
        var example = resp.content && resp.content['application/json'] && resp.content['application/json'].example;
        html += '<div class="resp"><div class="resp-head"><span class="status '
          + (Number(code) < 400 ? 'ok' : 'err') + '">' + esc(code) + '</span><span>' + esc(resp.description || '') + '</span></div>';
        if (example) html += '<pre>' + esc(JSON.stringify(example, null, 2)) + '</pre>';
        html += '</div>';
      });
    }

    return html + '</section>';
  }

  function render() {
    document.getElementById('title').textContent = spec.info.title;
    document.getElementById('lead').textContent = spec.info.description || '';
    document.getElementById('ver').textContent = 'API ' + (spec.info.version || '');
    document.getElementById('base').textContent = (spec.servers && spec.servers[0] && spec.servers[0].url) || location.origin;
    document.title = spec.info.title;

    renderNav();
    document.getElementById('content').innerHTML = ops().map(renderOp).join('');
  }

  document.getElementById('q').addEventListener('input', function (e) {
    var keyword = e.target.value.trim().toLowerCase();
    Array.prototype.forEach.call(document.querySelectorAll('#nav a, .op'), function (node) {
      node.style.display = !keyword || node.getAttribute('data-key').indexOf(keyword) >= 0 ? '' : 'none';
    });
  });

  fetch('/api/docs/openapi.json')
    .then(function (r) { return r.json(); })
    .then(function (data) { spec = data; render(); })
    .catch(function (err) {
      document.getElementById('content').innerHTML = '<p class="empty">文档加载失败：' + esc(err.message) + '</p>';
    });
})();
</script>
</body>
</html>
