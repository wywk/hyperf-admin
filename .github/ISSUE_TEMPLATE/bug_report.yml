name: 🐛 Bug 反馈 / Bug Report
description: 报告一个问题，帮助我们改进 / Report an issue to help us improve
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈问题！请尽量填写完整，否则可能无法定位。/ Thanks for taking the time to report a bug!

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么 / What happened?
      description: 请描述问题现象与期望行为。/ A clear description of the bug and the expected behavior.
      placeholder: 点击导出按钮后页面报 500，期望正常下载 Excel…
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 使用 demo 账号登录
        2. 进入「登录审计」页
        3. 点击「导出」
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题所属模块 / Which module?
      options:
        - 认证 / 登录 / Auth
        - 用户 / 角色 / 部门 / Users & RBAC
        - 日志审计 / Audit logs
        - 定时任务 / Crontab
        - 任务中心 / Jobs
        - 代码生成器 / Code generator
        - 通知 / Notifications
        - 其他 / Other
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: 环境信息 / Environment
      placeholder: |
        - PHP: 8.1.x
        - Swoole: 5.x
        - MySQL: 5.7 / 8.0
        - Redis: 7.x
        - 部署方式: Docker / 手动
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 错误日志 / Logs
      description: 粘贴 runtime/logs/hyperf.log 中的相关堆栈，或浏览器控制台报错。
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: 自查清单 / Checklist
      options:
        - label: 我已搜索现有 Issue，确认没有重复 / I have searched existing issues
          required: true
        - label: 我使用的是 main 分支最新代码 / I am on the latest main
