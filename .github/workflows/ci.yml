name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:5.7.41
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hyperf_admin_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.2
        ports:
          - 6379:6379
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: hyperf_admin_test
      DB_USERNAME: root
      DB_PASSWORD: root
      DB_PREFIX: ha_
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
    strategy:
      matrix:
        php: ['8.1']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: swoole, pdo_mysql, redis, pcntl, bcmath
          coverage: none

      - name: Verify Swoole
        run: php --ri swoole | head -3

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint (php -l)
        run: |
          find app config migrations seeders -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Code style (php-cs-fixer, strict)
        run: |
          if [ -f vendor/bin/php-cs-fixer ]; then
            PHP_CS_FIXER_IGNORE_ENV=1 vendor/bin/php-cs-fixer fix --dry-run --diff
          else
            echo "php-cs-fixer not installed, skip"
          fi

      - name: Static analysis (phpstan)
        run: composer analyse

      - name: Prepare test database
        run: |
          mysql -h 127.0.0.1 -uroot -proot -e \
            "CREATE DATABASE IF NOT EXISTS hyperf_admin_test DEFAULT CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;"
          php bin/hyperf.php migrate --force
          php bin/hyperf.php db:seed --force

      - name: Run tests (phpunit via test/run.php)
        run: php test/run.php

      # 覆盖率报告（协程运行器对 pcov 支持尚不完整，先作为非阻塞报告产出）
      - name: Coverage report (non-blocking)
        continue-on-error: true
        run: |
          php -d pcov.enabled=1 test/run.php --coverage-clover coverage/clover.xml || true
          if [ -f coverage/clover.xml ]; then
            php -r '
              $xml = simplexml_load_file("coverage/clover.xml");
              $m = $xml->xpath("//metrics");
              $el = 0; $ec = 0;
              foreach ($m as $x) { $el += (int)$x["elements"]; $ec += (int)$x["coveredelements"]; }
              printf("Line coverage: %.1f%% (%d/%d)%s", $el ? $ec / $el * 100 : 0, $ec, $el, PHP_EOL);
            '
          fi

      - name: Upload coverage artifact
        if: hashFiles('coverage/clover.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: coverage/clover.xml

  frontend:
    name: Frontend (type check + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check (vue-tsc)
        run: npx vue-tsc --noEmit

      - name: Build
        run: npm run build
